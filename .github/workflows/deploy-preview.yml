name: Deploy Preview to GitHub Pages

on:
  push:
    branches:
      - preview

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare files for deployment
        run: |
          # Remove files not needed for preview
          rm -rf scratch/ __pycache__/
          rm -f *.py *.pyc *.pyo *.mp4
          rm -f index.php
          rm -f .gitignore
          echo "Files to deploy:"
          ls -la

      - name: Inject redirect to production site
        run: |
          # Redirect all HTML pages to www.sterimar.shop
          REDIRECT_SCRIPT='<script>if(window.location.hostname!=="www.sterimar.shop"){window.location.replace("https://www.sterimar.shop"+window.location.pathname.replace("/sterimar",""))}</script>'
          for file in *.html; do
            if [ -f "$file" ]; then
              sed -i "s|<head>|<head>${REDIRECT_SCRIPT}|I" "$file"
              echo "Redirect injected in: $file"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
